name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # uv picks up [tool.uv].extra-index-url from pyproject.toml automatically
        run: uv pip install --system -e ".[dev]"

      - name: Ruff — lint
        run: ruff check radkit_catc_sync/ tests/

      - name: Ruff — format check
        run: ruff format --check radkit_catc_sync/ tests/

      - name: Mypy — type check
        run: mypy radkit_catc_sync/ tests/

      - name: Pytest
        run: pytest
